<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7f2"><title>台股小幫手｜AI Stock Watcher</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="app"><header class="top"><div class="brand"><span class="bot">✦</span><div><h1>台股小幫手</h1><p>AI Stock Watcher · 我的股票觀察日記</p></div></div><span id="connection" class="status">尚未連接資料服務</span></header><div class="layout"><section class="panel chat"><div class="section-title"><div><h2>和小幫手聊聊</h2><p>查詢行情、整理關注清單，慢慢看懂市場</p></div><span>✦</span></div><div id="messages" class="messages" aria-live="polite"><div class="bubble assistant">你好！我是台股小幫手。你可以先在右側新增股票，或問我「2330 最近表現如何？」<br><small>提示：要啟用真正的 AI 回覆，需先部署並設定 Worker 服務。</small></div></div><div class="quick"><button data-prompt="幫我整理自選股的觀察重點">整理觀察重點</button><button data-prompt="請解釋什麼是收盤價">什麼是收盤價？</button></div><form id="chatForm" class="composer"><input id="chatInput" placeholder="輸入問題，例如：2330 今天收盤價是多少？" autocomplete="off" maxlength="500" required><button type="submit">送出 ↑</button></form></section><aside class="side"><section class="panel"><div class="section-title"><div><h2>我的觀察清單</h2><p>只顯示 API 提供的資料，不推測股價</p></div><button id="refresh" class="ghost" title="重新取得行情">↻ 更新</button></div><form id="addForm" class="add"><input id="stockCode" inputmode="numeric" maxlength="6" pattern="[0-9]{4,6}" placeholder="輸入股票代碼，例如 2330" required><button type="submit">＋ 新增</button></form><div id="watchlist" class="watchlist"></div><p class="hint" id="dataNote">行情來源：臺灣證券交易所 OpenAPI（非即時報價）。</p></section><section class="panel"><div class="section-title"><div><h2>價格提醒</h2><p>網站開啟或更新時檢查價格條件</p></div><span class="bell">♧</span></div><form id="alertForm" class="alertform"><select id="alertStock" aria-label="股票"></select><select id="alertType" aria-label="提醒條件"><option value="below">低於或等於</option><option value="above">高於或等於</option></select><input id="alertPrice" type="number" min="0.01" step="0.01" placeholder="價格 (元)" required><button type="submit">新增提醒</button></form><div id="alerts" class="alerts"></div></section></aside></div><footer>資料僅供學習與觀察，非投資建議。每日行情不等同即時報價。 · <a href="https://openapi.twse.com.tw/" target="_blank" rel="noreferrer">資料來源</a></footer></main><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/app.js"></script></body></html>
